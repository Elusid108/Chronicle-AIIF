<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Chronicle: Iterative Fiction Engine</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Merriweather', 'serif'],
                        display: ['Cinzel', 'serif'],
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.8s ease-out',
                        'nebula': 'nebula 10s ease infinite',
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                        nebula: {
                            '0%, 100%': { backgroundPosition: '0% 50%' },
                            '50%': { backgroundPosition: '100% 50%' },
                        }
                    }
                }
            }
        }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&family=Merriweather:ital,wght@0,300;0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">

    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom": "https://esm.sh/react-dom@18.2.0?external=react",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client?external=react",
            "htm": "https://esm.sh/htm@3.1.1",
            "lucide-react": "https://esm.sh/lucide-react@0.344.0?external=react"
        }
    }
    </script>

    <style>
        /* Base styles */
        html { --app-height: 100svh; }
        html, body { margin: 0; background-color: #000; color: #e5e7eb; min-height: 100%; }
        body { overflow-x: hidden; overflow-y: auto; }
        #root { min-height: var(--app-height, 100svh); }

        /* Custom scrollbar to match the app's aesthetic */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #000; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #475569; }

        .nebula-loader {
            background: linear-gradient(-45deg, #0f172a, #1e1b4b, #312e81, #0f172a);
            background-size: 400% 400%;
            animation: nebula 10s ease infinite;
        }
        .nebula-pulse { animation: pulse 2s infinite; }
        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
        .text-shadow-lg {
            text-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
        }
        /* Blur transition */
        .blur-loading {
            filter: blur(12px) brightness(0.6);
            transition: filter 1s ease;
        }

        .codex-portrait-frame {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #050505;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 0 1px #3a2a12, 0 10px 28px rgba(0, 0, 0, 0.55);
        }
        .codex-portrait-photo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .codex-portrait-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            color: #4b5563;
            background: rgba(0, 0, 0, 0.6);
        }
        .codex-portrait-ornament {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="./src/main.js"></script>
</body>
</html>
